server {
    listen 80;
    listen [::]:80;
    server_name ziyangxiaozhang.com www.ziyangxiaozhang.com;

    return 301 https://www.ziyangxiaozhang.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ziyangxiaozhang.com;

    ssl_certificate /etc/nginx/ssl/ziyangxiaozhang/www.ziyangxiaozhang.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ziyangxiaozhang/www.ziyangxiaozhang.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZiyangSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://www.ziyangxiaozhang.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ziyangxiaozhang.com;

    ssl_certificate /etc/nginx/ssl/ziyangxiaozhang/www.ziyangxiaozhang.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ziyangxiaozhang/www.ziyangxiaozhang.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZiyangSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
